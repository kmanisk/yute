[package]
name = "yute-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for yute: InnerTube TV client, OAuth, parser, playback tracking, queue, and mpv controller"
license = "MIT"
readme = "README.md"
keywords = ["youtube", "terminal", "tui", "mpv"]
categories = ["command-line-utilities", "multimedia"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]
repository = "https://github.com/kmanisk/yute"
homepage = "https://github.com/kmanisk/yute"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
quick-xml = { version = "0.37", features = ["serialize"] }
sha1 = "0.10"
sha2 = "0.10"
directories = "6"
unicode-width = "0.2"
urlencoding = "2.1"
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
aes-gcm = "0.11.1"
hex = "0.4.3"
tokio-util = { version = "0.7", features = ["rt"] }
