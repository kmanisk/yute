[package]
name = "ytui"
version = "0.1.0"
edition = "2021"
description = "Fast, keyboard-driven YouTube terminal client in Rust with personal recommendations, Sixel/Kitty thumbnails, and MPV playback"
license = "MIT"

[[bin]]
name = "ytui"
path = "src/main.rs"

[lib]
name = "ytui"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
quick-xml = { version = "0.37", features = ["serialize"] }
sha1 = "0.10"
sha2 = "0.10"
directories = "6"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
urlencoding = "2.1"
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
